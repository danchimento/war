<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>War</title>
  <link rel="stylesheet" href="war.css">
</head>
<body>
  <div id="game" class="game">

    <!-- OPPONENT AREA -->
    <div class="player-area opponent-area">
      <div class="player-label">Opponent</div>
      <div class="deck-zone">
        <div id="opponent-deck" class="deck" data-owner="opponent">
          <div class="deck-stack"></div>
          <span class="deck-count">0</span>
        </div>
      </div>
    </div>

    <!-- BATTLE ZONE -->
    <div id="battle-zone" class="battle-zone">
      <div id="war-pile-opponent" class="war-pile war-pile--opponent"></div>
      <div id="opponent-battle" class="battle-slot"></div>
      <div id="result-flash" class="result-flash"></div>
      <div id="player-battle" class="battle-slot"></div>
      <div id="war-pile-player" class="war-pile war-pile--player"></div>
    </div>

    <!-- PLAYER AREA -->
    <div class="player-area player-area--self">
      <div class="deck-zone">
        <div id="player-deck" class="deck" data-owner="player">
          <div class="deck-stack"></div>
          <span class="deck-count">0</span>
        </div>
        <div id="tap-prompt" class="tap-prompt">Tap to play</div>
      </div>
      <div class="player-label">You</div>
    </div>

    <!-- ACTIVE UPGRADES -->
    <div id="active-upgrades" class="active-upgrades"></div>

    <!-- XP BAR -->
    <div id="xp-bar-container" class="xp-bar-container">
      <div id="xp-bar-fill" class="xp-bar-fill"></div>
      <span id="xp-bar-label" class="xp-bar-label">XP</span>
    </div>

    <!-- UPGRADE CHOICE OVERLAY -->
    <div id="upgrade-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>Choose an Upgrade</h2>
        <div id="upgrade-choices" class="upgrade-choices"></div>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameover-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="gameover-message"></h2>
        <button id="restart-btn" class="btn">Play Again</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
  <script src="war-simulation.js"></script>
  <script src="war.js"></script>
</body>
</html>
