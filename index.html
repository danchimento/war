<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>War</title>
  <link rel="stylesheet" href="war.css?v=14">
</head>
<body>
  <!-- EVAL BAR (card advantage indicator) -->
  <div id="eval-bar" class="eval-bar">
    <div class="eval-bar-mid"></div>
    <div id="eval-bar-fill" class="eval-bar-fill"></div>
  </div>

  <!-- XP BAR (vertical, right side) -->
  <div id="xp-bar-container" class="xp-bar-container">
    <div id="xp-bar-fill" class="xp-bar-fill"></div>
    <span id="xp-bar-label" class="xp-bar-label">XP</span>
  </div>

  <div id="game" class="game">

    <!-- OPPONENT AREA -->
    <div class="player-area opponent-area">
      <div class="deck-zone">
        <div id="opponent-deck" class="deck" data-owner="opponent">
          <div class="deck-stack"></div>
          <span class="deck-count">0</span>
        </div>
      </div>
    </div>

    <!-- BATTLE ZONE -->
    <div id="battle-zone" class="battle-zone">
      <div id="combo-display" class="combo-display hidden"></div>
      <div id="opponent-cards" class="card-row"></div>
      <div id="result-flash" class="result-flash"></div>
      <div id="player-cards" class="card-row"></div>
    </div>

    <!-- PLAYER AREA -->
    <div class="player-area player-area--self">
      <div class="deck-zone">
        <div id="player-deck" class="deck" data-owner="player">
          <div class="deck-stack"></div>
          <span class="deck-count">0</span>
        </div>
      </div>
    </div>

    <!-- ACTIVE UPGRADES -->
    <div id="active-upgrades" class="active-upgrades"></div>
    <div id="badge-tooltip" class="badge-tooltip hidden"></div>

    <!-- UPGRADE CHOICE OVERLAY -->
    <div id="upgrade-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>Choose an Upgrade</h2>
        <div id="upgrade-choices" class="upgrade-choices"></div>
        <button id="upgrade-confirm-btn" class="btn btn--disabled" disabled>Confirm</button>
      </div>
    </div>

    <!-- DECK VIEWER MODAL -->
    <div id="deck-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>Your Deck</h2>
        <div id="deck-list" class="deck-list"></div>
        <button id="deck-close-btn" class="btn">Close</button>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameover-overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="gameover-message"></h2>
        <div id="gameover-stats" class="gameover-stats"></div>
        <button id="restart-btn" class="btn">Play Again</button>
      </div>
    </div>

    <!-- DECK VIEWER FAB -->
    <button id="deck-fab" class="deck-fab">&#9830;</button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
  <script src="war-simulation.js?v=14"></script>
  <script src="war.js?v=14"></script>
</body>
</html>
